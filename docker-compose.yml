services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7070:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  config-service:
    build:
      context: ./server/config-service
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    restart: unless-stopped
