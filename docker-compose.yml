services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7070:7070"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
