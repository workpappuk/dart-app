server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

springdoc:
  swagger-ui:
    urls:
      - name: auth-server-local
        url: /auth-service/v3/api-docs
      # Add more services as needed

spring:
  application:
    name: gateway-service
  profiles:
    active: local
  config:
    import: "optional:configserver:http://localhost:8888"



---
spring:
  application:
    name: gateway-service-local
  config:
    activate:
      on-profile: local
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-server-local
              predicates:
                - Path=/auth-service/**
              filters:
                - StripPrefix=1