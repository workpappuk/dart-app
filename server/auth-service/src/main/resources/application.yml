server:
  port: 8089

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    
spring:
  application:
    name: auth-service
  profiles:
    active: local
  config:
    import: "configserver:"
---
spring:
  dart:
    swagger:
      enabled: true
    jwt:
      secret: oNConES5ItWk8njkVHac4/gtkpQjVeBVlAuWYhot2EOkpZdCdiER5Jl8Fg9t3DAA8Ti1z4EG9NsPfPYHLdYTWw==
      expiration: 86400000  # 7 days in milliseconds
  application:
    name: auth-server-local
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/dart_db
    username: dart_user
    password: dart_password
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

