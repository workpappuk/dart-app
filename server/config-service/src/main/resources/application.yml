server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

spring:
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:./config-repo

---
spring:
  application:
    name: config-service-native
  config:
    activate:
      on-profile: native

---
spring:
  application:
    name: config-service-dev
  config:
    activate:
      on-profile: dev

---
spring:
  application:
    name: config-service-staging
  config:
    activate:
      on-profile: staging
---
spring:
  application:
    name: config-service-prod
  config:
    activate:
      on-profile: prod